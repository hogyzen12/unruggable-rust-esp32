[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --chip esp32s3 --flash-size 8mb --before usb-reset --after hard-reset --partition-table .embuild/espressif/esp-idf/v5.2.3/components/partition_table/partitions_singleapp_large.csv"

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v5.2.3"
