[package]
name = "program"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
solana-program-error = "3.0.1"
solana-falcon512 = { path = ".." }

[dev-dependencies]
mollusk-svm = "0.12.0"
solana-instruction = "3.4.0"
solana-address = "2.6.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
