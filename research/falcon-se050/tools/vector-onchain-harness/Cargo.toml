[package]
name = "vector-onchain-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.102"
base64 = "=0.22.1"
bincode = "=1.3.3"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serialport = "=4.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
solana-address-lookup-table-interface = { version = "=3.0.1", features = ["bincode", "bytemuck"] }
solana-commitment-config = "=3.1.1"
solana-falcon512 = { path = "../../solana-falcon512" }
solana-instruction = { version = "=3.1.0", default-features = false, features = ["std"] }
solana-instructions-sysvar = "=3.0.0"
solana-keypair = "=3.1.2"
solana-message = "=3.0.1"
solana-program-pack = "=3.0.0"
solana-pubkey = { version = "=3.0.0", default-features = false, features = ["std", "sha2", "curve25519"] }
solana-rpc-client = "=3.1.14"
solana-signature = { version = "=3.3.0", default-features = false, features = ["std", "verify"] }
solana-signer = "=3.0.0"
solana-stake-interface = { version = "=2.0.2", features = ["bincode"] }
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = { version = "=3.0.2", features = ["bincode"] }
spl-associated-token-account-interface = "=2.0.0"
spl-token-interface = "=2.0.0"
